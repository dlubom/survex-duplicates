name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install Survex
        run: |
          sudo apt-get update
          sudo apt-get install --yes survex
          dump3d --version
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Test
        run: uv run --locked pytest -q -rs
      - name: Check types
        run: uv run --locked mypy
      - name: Lint
        run: uv run --locked ruff check survex_duplicates tests benchmarks znajdz_duplikaty.py
      - name: Check formatting
        run: uv run --locked ruff format --check survex_duplicates tests benchmarks znajdz_duplikaty.py
      - name: Verify complete registry results
        run: uv run --locked python -m benchmarks.verify_kataster --out-dir reports/verification
      - name: Build distributions
        run: uv build
