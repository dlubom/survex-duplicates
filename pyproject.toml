[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "survex-duplicates"
version = "1.0.0"
description = "Exact endpoint duplicate candidates in Survex spatial models"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.3.5,<3", "scipy>=1.16.3,<2"]

[project.urls]
Repository = "https://github.com/dlubom/survex-duplicates"
Issues = "https://github.com/dlubom/survex-duplicates/issues"

[dependency-groups]
dev = ["pytest>=8.4,<10", "mypy>=1.20,<2", "ruff>=0.17.2,<1"]

[project.scripts]
survex-duplicates = "survex_duplicates.cli:main"

[tool.setuptools.packages.find]
include = ["survex_duplicates*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real dump3d (and optionally KATASTER_PATH)"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["survex_duplicates"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
